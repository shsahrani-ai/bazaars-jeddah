<!doctype html><html lang='ar' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>بازارات جدة</title><link rel='stylesheet' href='style.css'></head><body>
<header><div class='brand'>بازارات جدة</div><button id='adminBtn' class='ghost'>لوحة المنظم</button></header>
<main><section class='hero'><span>احجز موقعك بسهولة</span><h1>اختر البازار، ثم اختر مكانك بنفسك</h1><p>منصة تجريبية لحجز البوثات والمساحات داخل بازارات جدة.</p></section>
<section id='home'><h2>البازارات المتاحة</h2><div id='bazaarCards' class='cards'></div></section>
<section id='detail' class='hidden'><button class='back' onclick='showHome()'>← رجوع للبازارات</button><div id='bazaarInfo'></div><div class='legend'><span><i class='dot available'></i> متاح</span><span><i class='dot selected'></i> مختار</span><span><i class='dot booked'></i> محجوز</span></div><div id='booths' class='booths'></div><div id='selection' class='selection muted'>اختر أحد المواقع من المخطط.</div></section>
<section id='admin' class='hidden'><button class='back' onclick='showHome()'>← رجوع</button><h2>لوحة المنظم — تجربة</h2><div class='admin-grid'><div class='panel'><h3>ملخص</h3><div id='stats'></div></div><div class='panel'><h3>الحجوزات</h3><div id='bookings'></div></div></div></section>
</main>
<div id='modal' class='modal hidden'><div class='modal-card'><button class='close' onclick='closeModal()'>×</button><h2>إكمال الحجز</h2><p id='modalBooth'></p><label>الاسم<input id='name' placeholder='مثال: فايز'></label><label>رقم الجوال<input id='phone' inputmode='numeric' placeholder='05xxxxxxxx'></label><label>نوع النشاط<input id='activity' placeholder='عطور، ملابس، قهوة...'></label><button class='primary' onclick='confirmBooking()'>تأكيد الحجز التجريبي</button><small>هذه نسخة تجريبية ولا يتم تحصيل أي مبلغ.</small></div></div>
<script src='app.js'></script></body></html>
